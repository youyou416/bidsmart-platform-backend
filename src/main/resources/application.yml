spring:
  application:
    name: platform-base
  profiles:
    active: ${APP_ENV:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:2881}/${DB_NAME:hr_score_dev}?sslMode=${DB_SSL_MODE:DISABLED}&allowMultiQueries=false&allowPublicKeyRetrieval=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=5000&socketTimeout=10000&characterEncoding=UTF-8
    username: ${DB_USERNAME:root@sys}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
      initialization-fail-timeout: 1
  sql:
    init:
      mode: never
  jdbc:
    template:
      query-timeout: 10
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      enabled: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: ${SESSION_IDLE_TIMEOUT:30m}
      cookie:
        name: BIDSMARTSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        path: /
      tracking-modes: cookie
  tomcat:
    max-http-form-post-size: 16KB
    max-swallow-size: 16KB
    connection-timeout: 10s
platform:
  environment: ${APP_ENV:dev}
  database-password: ${DB_PASSWORD:}
  database-username: ${DB_USERNAME:root@sys}
  database-name: ${DB_NAME:hr_score_dev}
  database-host: ${DB_HOST:127.0.0.1}
  database-port: ${DB_PORT:2881}
  database-ssl-mode: ${DB_SSL_MODE:DISABLED}
  secure-cookie: ${SESSION_COOKIE_SECURE:false}
  transport-verified: ${TRANSPORT_VERIFIED:false}
  debug-enabled: false
  absolute-session-timeout: ${SESSION_ABSOLUTE_TIMEOUT:8h}
  max-login-failures: ${LOGIN_MAX_FAILURES:5}
  failure-window: ${LOGIN_FAILURE_WINDOW:15m}
  lockout: ${LOGIN_LOCKOUT:15m}
  csrf-requests-per-minute: 60
  max-request-body-bytes: 16384
  audit-retention-days: ${AUDIT_RETENTION_DAYS:30}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173}
  bootstrap-enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
  bootstrap-username: ${BOOTSTRAP_ADMIN_USERNAME:}
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-role-id: ${BOOTSTRAP_ADMIN_ROLE_ID:1001}
  bootstrap-department-id: ${BOOTSTRAP_ADMIN_DEPARTMENT_ID:1001}
  system-name: ${PUBLIC_SYSTEM_NAME:智能化竞价采购平台 · 基础框架}
  logo-path: /mark.svg
  theme-color: '#2563eb'
  tabs-enabled: true
logging:
  level:
    root: INFO
    com.zaxxer.hikari: WARN
    org.springframework.jdbc: WARN
    org.springframework.security: WARN
